apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-app
  labels:
    app: insuretech-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-app
  template:
    metadata:
      labels:
        app: insuretech-app
    spec:
      containers:
        - name: insuretech-app
          # Образ тестового приложения из задания (порт 8080, GET /, GET /metrics)
          image: dnit13/docker-for-k8s-hpa:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "15Mi"
              cpu: "50m"
            limits:
              memory: "30Mi"
              cpu: "200m"