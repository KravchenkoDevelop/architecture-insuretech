apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-app
  labels:
    app: insuretech-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-app
  template:
    metadata:
      labels:
        app: insuretech-app
    spec:
      containers:
        - name: insuretech-app
          # Официальный k8s-образ для тестирования HPA (порт 8080, GET /, POST /ConsumeMem)
          image: registry.k8s.io/e2e-test-images/resource-consumer:1.13
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "15Mi"
              cpu: "50m"
            limits:
              memory: "30Mi"
              cpu: "200m"