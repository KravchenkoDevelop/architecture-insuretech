[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: integration tests requiring a live Minikube cluster
    unit: static/unit tests (no cluster needed)

# Verbose output + short summary for failures
addopts =
    -v
    --tb=short
    --strict-markers

# Log settings — captured during test run
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Log file written after every run
log_file = tests/test-results.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
